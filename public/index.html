<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style> body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; } </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-800 w-full max-w-lg p-8 rounded-2xl shadow-2xl border border-slate-700">
        <h1 class="text-2xl font-bold text-center mb-6 text-blue-400">API Time Manager</h1>

        <div class="space-y-4">
            <div>
                <label class="block text-sm text-slate-300 mb-1">Apna Main API Base URL Dalein (Bina ?number= ke)</label>
                <input type="text" id="apiUrl" value="https://custom-api-times.vercel.app/api/vehicle" 
                    class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500">
            </div>

            <div>
                <label class="block text-sm text-slate-300 mb-1">Time (Days)</label>
                <input type="number" id="days" value="30" min="1"
                    class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500">
            </div>

            <button onclick="generate()" id="btn" class="w-full bg-blue-600 hover:bg-blue-700 py-3 rounded-lg font-bold transition">
                Generate Short URL 🚀
            </button>
        </div>

        <div id="result" class="mt-6 p-4 bg-slate-900 border border-green-500/50 rounded-lg hidden">
            <p class="text-green-400 text-sm font-bold mb-2">✅ Success!</p>
            <p class="text-xs text-slate-400 mb-2" id="expiryText"></p>
            <div class="flex gap-2">
                <input type="text" id="finalUrl" readonly class="w-full bg-slate-800 p-2 text-green-300 rounded border border-slate-700 text-sm">
                <button onclick="navigator.clipboard.writeText(document.getElementById('finalUrl').value); alert('Copied!')" class="bg-slate-700 px-4 rounded hover:bg-slate-600">Copy</button>
            </div>
            <p class="text-xs text-yellow-400 mt-2">* Customer is URL ke aakhir me GJ05MS9717 ki jagah apna number dalega.</p>
        </div>
        <p id="error" class="mt-4 text-red-400 text-center text-sm hidden"></p>
    </div>

    <script>
        // 🔥 1. PANEL PASSWORD PROTECTION
        const PANEL_PASSWORD = "EliteAdmin@2026"; // <-- Yahan apna password set karo
        const enteredPass = prompt("Enter Admin Password:");
        if (enteredPass !== PANEL_PASSWORD) {
            document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:20%; font-family:sans-serif;'>⛔ Access Denied!</h1>";
            throw new Error("Unauthorized");
        }

        async function generate() {
            const apiUrl = document.getElementById("apiUrl").value;
            const days = document.getElementById("days").value;
            
            document.getElementById("btn").innerText = "Generating...";
            document.getElementById("result").classList.add("hidden");
            document.getElementById("error").classList.add("hidden");

            try {
                const res = await fetch("/api/generate", {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json",
                        "x-panel-secret": "EliteAdmin@2026" // 🔥 2. SECRET HEADER (Postman block)
                    },
                    body: JSON.stringify({ apiUrl, days })
                });
                const data = await res.json();
                
                if (data.success) {
                    document.getElementById("finalUrl").value = data.url;
                    document.getElementById("expiryText").innerText = "Valid till: " + data.expiry;
                    document.getElementById("result").classList.remove("hidden");
                } else {
                    throw new Error(data.error);
                }
            } catch (err) {
                document.getElementById("error").innerText = "❌ " + err.message;
                document.getElementById("error").classList.remove("hidden");
            } finally {
                document.getElementById("btn").innerText = "Generate Short URL 🚀";
            }
        }
    </script>
</body>
</html>
