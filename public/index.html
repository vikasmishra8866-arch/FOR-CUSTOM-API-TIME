<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allrounder API Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="glass w-full max-w-2xl p-8 rounded-2xl shadow-2xl relative overflow-hidden">
        <!-- Decor -->
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 via-purple-500 to-pink-500"></div>

        <h1 class="text-3xl font-bold mb-2 text-center bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-400">
            API Access Manager
        </h1>
        <p class="text-center text-slate-400 mb-8 text-sm">Generate secure, time-limited API URLs</p>

        <div class="space-y-5">
            <!-- API URL Input -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">API Endpoint URL</label>
                <input type="text" id="apiUrl" 
                    class="w-full bg-slate-800 text-white border border-slate-600 rounded-lg p-3 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition"
                    placeholder="https://vehicle-api-coral.vercel.app/api/vehicle?number=GJ05MS9717" 
                    value="https://vehicle-api-coral.vercel.app/api/vehicle?number=GJ05MS9717">
            </div>

            <!-- Validity Input -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Validity Duration</label>
                <div class="flex gap-2">
                    <select id="unit" class="bg-slate-800 text-white border border-slate-600 rounded-lg p-3 focus:outline-none focus:border-blue-500">
                        <option value="1">Days</option>
                        <option value="30">Months</option>
                    </select>
                    <input type="number" id="duration" value="30" min="1"
                        class="w-full bg-slate-800 text-white border border-slate-600 rounded-lg p-3 focus:outline-none focus:border-blue-500">
                </div>
            </div>

            <!-- Generate Button -->
            <button onclick="generateUrl()" id="genBtn"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition duration-200 flex justify-center items-center">
                <span id="btnText">Generate Secure URL 🚀</span>
                <svg id="loader" class="animate-spin ml-2 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                </svg>
            </button>
        </div>

        <!-- Result Box -->
        <div id="resultBox" class="mt-6 p-4 bg-slate-800 border border-green-500/30 rounded-lg hidden relative">
            <h3 class="text-green-400 text-sm font-semibold mb-2">✅ URL Generated Successfully!</h3>
            <p class="text-xs text-slate-400 mb-2" id="expiryInfo"></p>
            <div class="flex gap-2">
                <input type="text" id="finalUrl" readonly class="w-full bg-slate-900 border border-slate-700 text-green-300 text-sm rounded p-2 focus:outline-none">
                <button onclick="copyUrl()" class="bg-slate-700 hover:bg-slate-600 px-4 rounded transition text-sm font-medium">Copy</button>
            </div>
        </div>
        
        <p id="errorMsg" class="mt-4 text-red-400 text-center text-sm hidden"></p>
    </div>

    <script>
        async function generateUrl() {
            const apiUrl = document.getElementById("apiUrl").value;
            const duration = document.getElementById("duration").value;
            const unit = document.getElementById("unit").value;

            if (!apiUrl) return alert("Please enter API URL");

            const totalDays = parseInt(duration) * parseInt(unit);

            // UI Loading state
            document.getElementById("genBtn").disabled = true;
            document.getElementById("btnText").innerText = "Generating...";
            document.getElementById("loader").classList.remove("hidden");
            document.getElementById("resultBox").classList.add("hidden");
            document.getElementById("errorMsg").classList.add("hidden");

            try {
                const res = await fetch("/api/generate", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ apiUrl, days: totalDays })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    document.getElementById("finalUrl").value = data.url;
                    document.getElementById("expiryInfo").innerText = `Valid until: ${data.expiry} (${totalDays} days)`;
                    document.getElementById("resultBox").classList.remove("hidden");
                } else {
                    throw new Error(data.error || "Failed to generate");
                }
            } catch (err) {
                document.getElementById("errorMsg").innerText = "❌ " + err.message;
                document.getElementById("errorMsg").classList.remove("hidden");
            } finally {
                // Reset button
                document.getElementById("genBtn").disabled = false;
                document.getElementById("btnText").innerText = "Generate Secure URL 🚀";
                document.getElementById("loader").classList.add("hidden");
            }
        }

        function copyUrl() {
            const copyText = document.getElementById("finalUrl");
            copyText.select();
            copyText.setSelectionRange(0, 99999); 
            navigator.clipboard.writeText(copyText.value);
            alert("✅ URL Copied to clipboard!");
        }
    </script>
</body>
</html>
